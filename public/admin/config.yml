backend:
  name: git-gateway
local_backend: true
media_folder: src/assets/img
public_folder: src/assets/img

collections:
  - name: "docs" # Used in routes, e.g., /admin/collections/blog
    label: "Docs" # Used in the UI
    folder: "src/content/docs" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    fields: # The fields for each document, usually in frontmatter
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "number" }
      - { label: "SectionNumber", name: "sectionNumber", widget: "string" }
      - {
          label: "excludeFromLinearNavigation",
          name: "excludeFromLinearNavigation",
          widget: "boolean",
        }
      - { label: "Body", name: "body", widget: "markdown" }
